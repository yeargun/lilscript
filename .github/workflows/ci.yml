name: CI

on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  # The gate: one Linux job over the compiler, its unit tests, the case runner
  # (every case and harvested regression in 18 lanes, against the ledger) and
  # the codec contract. Publishing lives in scripts/release-check.sh and runs
  # on demand, never in the gate (plan M2.1).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LILSCRIPT_NATIVE_CLANG: clang
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cargo fmt --all -- --check
      - run: node scripts/check-doc-links.mjs
      - run: cargo build --release --bins
      - run: cargo test --release --lib
      - run: cargo test --release --bins
      - run: node --test benchmarks/codec-contract.test.mjs
      - run: node --test scripts/verify-runners.test.mjs
      - run: node scripts/cases.mjs --compiler target/release/lilscript --json cases.json
      - name: Upload the case report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cases
          if-no-files-found: warn
          path: cases.json

  # The three-platform build runs on pull requests and on demand.
  build-matrix:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    env:
      LIBZ_SYS_STATIC: "1"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cargo test --all-targets
      - run: cargo build --release --bins
      - name: Verify canonical scorer fixtures
        run: node --test benchmarks/codec-contract.test.mjs
      - name: Reject dynamic codec libraries (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for binary in lilscript lilscript-codec; do
            if ldd "target/release/$binary" | grep -Eiq 'zlib|libz|brotli'; then
              echo "$binary dynamically links a codec library" >&2
              exit 1
            fi
          done
      - name: Reject dynamic codec libraries (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for binary in lilscript lilscript-codec; do
            if otool -L "target/release/$binary" | tail -n +2 | grep -Eiq 'zlib|libz|brotli'; then
              echo "$binary dynamically links a codec library" >&2
              exit 1
            fi
          done
      - name: Reject dynamic codec libraries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($binary in @("lilscript", "lilscript-codec")) {
            $bytes = [System.IO.File]::ReadAllBytes("target/release/$binary.exe")
            $strings = [System.Text.Encoding]::ASCII.GetString($bytes)
            if ($strings -match '(?i)(?:zlib|libz|brotli)[^\x00\r\n]{0,64}\.dll') {
              throw "$binary imports a dynamic codec library"
            }
          }
