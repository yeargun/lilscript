[package]
name = "lilscript"
version = "0.1.0"
edition = "2021"
description = "Compiler for the standalone LilScript language with optimized JavaScript code generation."
license = "MIT"

[dependencies]
logos = "0.16"
bumpalo = { version = "3", features = ["collections"] }
clap = { version = "4.5", features = ["derive"] }
ahash = "0.8"
indexmap = "2"
rayon = "1.10"
lsp-server = "0.10"
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
# Use zlib's C backend so compiler-in-loop gzip scoring matches the canonical
# verification lane byte-for-byte. The direct exact dependency below forces a
# bundled, static official zlib 1.3.1 instead of whichever system library is
# installed on the compiler host.
flate2 = { version = "=1.1.9", default-features = false, features = ["zlib"] }
libz-sys = { version = "=1.1.24", features = ["static"] }
# Pin the bundled official Google Brotli 1.1.0 encoder as the repository's
# canonical implementation. Other compatible encoders can rank short candidates
# differently, which is not acceptable for an exact served-byte objective.
compu-brotli-sys = "=1.1.0"
sha2 = "0.10"
semver = { version = "1", features = ["serde"] }
# The internal token parser remains the hot-path validator for the candidate
# beam. Oxc is reserved for the scored terminal frontier and final rewrite
# admission, giving emitted JavaScript a standards-complete syntax gate without
# multiplying parser work across every proposal (047: a fold that emits a wrong
# program ships without it).
oxc_allocator = "=0.143.0"
oxc_parser = "=0.143.0"
oxc_span = "=0.143.0"
# Foreign host modules (TypeScript or JavaScript) are type-stripped from their
# ESTree form's spans before delivery; no transformer or code generator.
oxc_ast = { version = "=0.143.0", features = ["serialize"] }

[dev-dependencies]
oxc_ast = "=0.143.0"

[lib]
name = "lilscript"
path = "src/lib.rs"

[patch.crates-io]
# Same pinned encoder, built with its official cleanup-on-allocation-failure
# contract so a compiler budget denial cannot terminate the process.
compu-brotli-sys = { path = "vendor/compu-brotli-sys" }

[[bin]]
name = "lilscript"
path = "src/main.rs"

[[bin]]
name = "lilpack"
path = "src/bin/lilpack.rs"

[[bin]]
name = "lilscript-codec"
path = "src/bin/lilscript-codec.rs"

# The shipped, measured profile. `debug-assertions` is off here on purpose: this
# is the binary the fleet builds and scores, and an assertion is not free.
#
# Stated explicitly because its absence was load-bearing and invisible. With no
# `[profile.release]` section at all, every `debug_assert!` in the tree compiled
# out of exactly the builds that measure ports, so an invariant guarded that way
# was never checked where it mattered. A gate must say which profile it holds in.
[profile.release]
debug-assertions = false

# Release code paths with invariants live. Same optimisation level and the same
# codec linkage as `release`, so timings and bytes stay comparable, but
# `debug_assert!` fires.
#
# Use this for any gate that asserts a compiler invariant rather than an output
# byte: `cargo test --profile release-assert`, and the twin-witness runs of the
# target-tree migration (`migration/002-the-instrument.md`). Do not publish sizes
# or timings from it -- publish from `release`.
[profile.release-assert]
inherits = "release"
debug-assertions = true
