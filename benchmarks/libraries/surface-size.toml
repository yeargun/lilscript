# The measured public contract is callability over the typed package domain;
# JavaScript constructor behavior is not documented by these package APIs.
[optimization]
preset = "maximum"
profile_guided = true
call_site_specialization = true
capture_signature_cloning = true
identical_function_folding = true

[javascript]
candidate_search = "production"
candidate_limit = 1536
candidate_byte_budget = 1048576
candidate_beam_width = 12
max_candidate_raw_growth_percent = 0
local_name_reserve = 48
stable_local_names = true
function_spelling = "arrow"
pool_numeric_literals = true
