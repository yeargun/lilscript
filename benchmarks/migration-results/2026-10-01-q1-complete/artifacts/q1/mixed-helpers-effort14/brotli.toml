[optimization]
preset = "maximum"
inlining = true
scalar_replacement = true

[javascript]
priority = "size-first"
strip_debug = false
strip_console_calls = false

[mangle]
identifiers = true
properties = true

[objective]
codecs = "brotli"

[effort]
level = 14

[policy.tactics]
constant-folding='off'
string-pooling='off'
call-specialization='off'
helper-sharing='off'
