[policy]
version = 3

[optimization]
preset = "maximum"
call_site_specialization = true

[javascript]
priority = "size-first"
# An exact allowlist: the decisions it omits (property-mangling,
# length-to-number-elision, parameterized-function-merging) are off. Omit it to
# use the `priority` defaults.
compression = [
  "identifier-mangling",
  "string-pooling",
  "string-array-packing",
]

[delivery]
mode = "single"

[lint]
enabled = true
providers = ["correctness", "effects", "performance", "size", "web"]
preset = "recommended"
deny_warnings = false
exclude = ["**/generated/**"]
pure_extern_allowlist = []

[format]
enabled = true
line_width = 100
newline = "lf"
organize_imports = true

[objective]
codecs = "brotli"

[effort]
# 13 favors smaller output. 14/15 also search more expensive marginal choices;
# the benefit varies by program and objective. Effort grants no runtime risks.
# Use policy.resources for hard ceilings and policy.tactics for individual
# permissions; see docs/configuration.md for each control's tradeoffs.
level = 13
