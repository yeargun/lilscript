[javascript]
priority = "size-first"
assume_pristine_builtins = true
strip_console = true
local_name_reserve = 8
candidate_search = "off"
function_spelling = "function"

[optimization]
preset = "maximum"
inlining = true
scalar_replacement = true

[mangle]
identifiers = true
properties = true
exports = true

[objective]
codecs = "brotli"

[effort]
level = 15
