[optimization]
preset = "maximum"

[javascript]
priority = "size-first"
candidate_search = "production"
strip_console = false
local_name_reserve = 48

[mangle]
identifiers = true
properties = true
exports = true
pool_strings = true

[bundle]
mode = "single"

[objective]
codecs = "brotli"

[effort]
level = 15
