<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #0e0e10;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      .box {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        background: linear-gradient(135deg, #6d5efc, #ff4ecd);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div class="box" id="a">0</div>
    <div class="box" id="b">1</div>
    <div class="box" id="c">2</div>
    <div class="box" id="d">3</div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
