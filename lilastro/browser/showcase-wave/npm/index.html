<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0e0e10; }
  .grid { display:grid; grid-template-columns:repeat(5,56px); gap:12px; }
  .dot {
    width:56px; height:56px; border-radius:14px; opacity:0;
    background: linear-gradient(140deg, #11998e, #38ef7d);
  }
  .dot:nth-child(2n) { background: linear-gradient(140deg, #8e2de2, #4a00e0); }
  .dot:nth-child(3n) { background: linear-gradient(140deg, #ff512f, #dd2476); }
</style>
</head>
<body>
  <div class="grid" id="grid"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
