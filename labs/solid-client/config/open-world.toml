# Reusable-package build: JavaScript consumers observe exports and public fields.
[javascript]
priority = "size-first"
optimization_level = 15
cost_model = "brotli"
function_spelling = "arrow"
# The positional aggregate layout this build once asked for is refused since
# plan M1.4 (D2: public aggregates are plain objects with named fields).
pool_numeric_literals = true

[mangle]
identifiers = true
properties = true
exports = false
pool_strings = true

[bundle]
mode = "single"
