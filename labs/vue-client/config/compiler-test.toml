# Compiler-written Vue delivery. No source staging or JavaScript rewriting.
[policy]
version = 3
[optimization]
preset = "maximum"
[javascript]
# Proxy traps, getters and patched globals are observable Vue behavior.
assume_pristine_builtins = false
assume_pure_property_reads = false
[objective]
codecs = "brotli"
[effort]
# Preserve the port's release effort. Development mode skips optional search.
level = 15
[execution]
jobs = 1
[mangle]
identifiers = true
properties = true
pool_strings = true

[defines]
APP_COMPAT = true
APP_DEV = true
APP_FEATURE_OPTIONS_API = true
APP_FEATURE_PROD_DEVTOOLS = false
ATTR_COMPAT = true
COMPAT_DEV = true
COMPAT_TEST = true
COMPILER_BROWSER = false
COMPILER_DEV = true
COMPONENT_COMPAT = true
COMPONENT_DEV = true
COMPONENT_ESM_BROWSER = false
COMPONENT_ESM_BUNDLER = true
COMPONENT_FEATURE_OPTIONS_API = true
COMPONENT_FEATURE_PROD_DEVTOOLS = false
COMPONENT_FEATURE_SUSPENSE = true
COMPONENT_GLOBAL = false
COMPONENT_SSR = true
CSS_MODULE_DEV = true
CSS_MODULE_GLOBAL = false
CSS_VARS_BROWSER = false
CSS_VARS_DEV = true
CSS_VARS_FEATURE_SUSPENSE = true
CSS_VARS_TEST = true
CUSTOM_ELEMENT_DEV = true
CUSTOM_ELEMENT_FEATURE_PROD_DEVTOOLS = false
DEV = true
DIRECTIVES_COMPAT = true
DIRECTIVES_DEV = true
EMITS_COMPAT = true
EMITS_DEV = true
EMITS_FEATURE_OPTIONS_API = true
EMITS_FEATURE_PROD_DEVTOOLS = false
EVENT_DEV = true
FEATURE_PROD_DEVTOOLS = false
FEATURE_SUSPENSE = true
GLOBAL_DEV = true
GLOBAL_PROD_DEVTOOLS = false
HYDRATION_FEATURE_SUSPENSE = true
INSTANCE_DEV = true
KEEP_ALIVE_BROWSER = false
KEEP_ALIVE_COMPAT = true
KEEP_ALIVE_DEV = true
KEEP_ALIVE_PROD_DEVTOOLS = false
KEEP_ALIVE_SSR = true
OPTIONS_COMPAT = true
OPTIONS_DEV = true
PROD_DEVTOOLS = false
PROD_HYDRATION_MISMATCH_DETAILS = false
PROPS_COMPAT = true
PROPS_DEV = true
PROPS_FEATURE_OPTIONS_API = true
PROP_COMPAT = true
PROP_DEV = true
PUBLIC_COMPAT = true
PUBLIC_DEV = true
PUBLIC_FEATURE_OPTIONS_API = true
PUBLIC_TEST = true
RENDERER_COMPAT = true
RENDERER_ESM_BUNDLER = true
RENDERER_FEATURE_PROD_DEVTOOLS = false
RENDERER_FEATURE_SUSPENSE = true
RENDER_UTILS_COMPAT = true
RENDER_UTILS_DEV = true
RUNTIME_DOM_COMPAT = true
RUNTIME_DOM_DEV = true
RUNTIME_DOM_SSR = true
SLOTS_COMPAT = true
SLOTS_DEV = true
STYLE_DEV = true
SUSPENSE_DEV = true
SUSPENSE_FEATURE = true
SUSPENSE_TEST = true
TELEPORT_FEATURE_SUSPENSE = true
TEST = true
TRANSITION_COMPAT = true
TRANSITION_DEV = true
TRANSITION_FEATURE_SUSPENSE = true
TRANSITION_GROUP_COMPAT = true
TRANSITION_GROUP_DEV = true
VUE_COMPAT = true
VUE_DEV = true
VUE_DEV_BROWSER = false
VUE_DEV_ESM_BUNDLER = true
VUE_ESM_BROWSER = false
VUE_ESM_BUNDLER = true
VUE_FEATURE_OPTIONS_API = true
VUE_FEATURE_PROD_DEVTOOLS = false
VUE_FEATURE_PROD_HYDRATION_MISMATCH_DETAILS = false
VUE_GLOBAL = false
VUE_HOST_FLAGS = true
VUE_VERSION = "test"
V_MODEL_COMPAT = true
V_ON_COMPAT = true
V_ON_DEV = true

[delivery]
mode = "split"
directory = "."
host_modules = "embed"
entry_names = "tests/[name].mjs"
chunk_names = "tests/chunks/test/[name]-[index].js"
[delivery.entries]
"vue-compat-upstream.candidate"="../src/package/vue-compat.lil"
"vue-compat-runtime-dom.candidate"="../src/package/runtime-dom-public.lil"
"compiler-core-upstream.candidate" = "../src/package/compiler-core.lil"
"compiler-dom-upstream.candidate" = "../src/package/compiler-dom.lil"
"compiler-sfc-upstream.candidate" = "../src/package/compiler-sfc-test.lil"
"compiler-sfc-warn.candidate" = "../src/package/compiler-sfc-warn.lil"
"compiler-ssr-upstream.candidate" = "../src/package/compiler-ssr-test.lil"
"reactivity-upstream.candidate" = "../src/package/reactivity-test.lil"
"runtime-core-upstream.candidate" = "../src/package/runtime-core-test.lil"
"runtime-dom-upstream.candidate" = "../src/package/runtime-dom.lil"
"runtime-test-upstream.candidate" = "../src/package/runtime-test.lil"
"server-renderer-upstream.candidate" = "../src/package/server-renderer.lil"
"shared-upstream.candidate" = "../src/package/shared.lil"
"vue-upstream.candidate" = "../src/package/vue.lil"
"vue.runtime-upstream.candidate" = "../src/package/vue.runtime.lil"

[dependencies]
vue-hosts = {path="../src/providers/node",version="=1.0.0",abi=1}
