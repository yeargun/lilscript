# Compiler-written forwarding entrypoints over one shared implementation graph.
# These preserve cross-package object identity and live binding transport.
[policy]
version=3
[objective]
codecs="brotli"
[effort]
level=13
[javascript]
assume_pristine_builtins=false
assume_pure_property_reads=false

[target.javascript]
format="esm"
[delivery]
mode="single"
directory="."
entry_names="packages/vuelil/@vue/compiler-sfc/dist/compiler-sfc.esm-browser.js"
[delivery.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/compiler-browser/compiler-sfc.js"
[delivery.entries]
api="../src/package/entrypoints/compiler-sfc.lil"

[[delivery.also]]
name="cjs"
directory="."
format="cjs"
entry_names="packages/vuelil/@vue/compiler-sfc/dist/compiler-sfc.cjs.js"
[delivery.also.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/compiler-cjs/development/compiler-sfc.cjs"

[[delivery.also]]
name="index"
directory="."
format="cjs"
entry_names="packages/vuelil/@vue/compiler-sfc/index.js"
[delivery.also.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/compiler-cjs/development/compiler-sfc.cjs"

[[delivery.also]]
name="vue-esm"
format="esm"
directory="."
entry_names="packages/vuelil/compiler-sfc/index.mjs"
[delivery.also.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/compiler-sfc.js"

[[delivery.also]]
name="vue-cjs"
format="cjs"
directory="."
entry_names="packages/vuelil/compiler-sfc/index.js"
[delivery.also.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/compiler-cjs/development/compiler-sfc.cjs"

[[delivery.also]]
name="vue-esm-browser"
format="esm"
directory="."
entry_names="packages/vuelil/compiler-sfc/index.browser.mjs"
[delivery.also.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/compiler-browser/compiler-sfc.js"

[[delivery.also]]
name="vue-cjs-browser"
format="cjs"
directory="."
entry_names="packages/vuelil/compiler-sfc/index.browser.js"
[delivery.also.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/compiler-cjs/development/compiler-sfc.cjs"
