# Compiler-written forwarding entrypoints over one shared implementation graph.
# These preserve cross-package object identity and live binding transport.
[policy]
version=3
[objective]
codecs="brotli"
[effort]
level=13
[javascript]
assume_pristine_builtins=false
assume_pure_property_reads=false

[target.javascript]
format="esm"
[delivery]
mode="single"
directory="."
entry_names="packages/vuelil/@vue/runtime-core/dist/runtime-core.esm-bundler.js"
[delivery.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/runtime-core.js"
[delivery.entries]
api="../src/package/entrypoints/runtime-core.lil"

[[delivery.also]]
name="cjs"
directory="."
format="cjs"
entry_names="packages/vuelil/@vue/runtime-core/dist/runtime-core.cjs.js"
[delivery.also.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/compiler-cjs/development/runtime-core.cjs"

[[delivery.also]]
name="cjs-production"
directory="."
format="cjs"
entry_names="packages/vuelil/@vue/runtime-core/dist/runtime-core.cjs.prod.js"
[delivery.also.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/compiler-cjs/production/runtime-core.cjs"

[[delivery.also]]
name="index"
directory="."
format="cjs"
entry_names="packages/vuelil/@vue/runtime-core/index.js"
[delivery.also.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/compiler-cjs/development/runtime-core.cjs"
