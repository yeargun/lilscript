# Compiler-written forwarding entrypoints over one shared implementation graph.
# These preserve cross-package object identity and live binding transport.
[policy]
version=3
[objective]
codecs="brotli"
[effort]
level=13
[javascript]
assume_pristine_builtins=false
assume_pure_property_reads=false

[target.javascript]
format="esm"
[delivery]
mode="single"
directory="."
entry_names="packages/vuelil/@vue/server-renderer/dist/server-renderer.esm-bundler.js"
[delivery.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/server-renderer.js"
[delivery.entries]
api="../src/package/entrypoints/server-renderer.lil"

[[delivery.also]]
name="browser"
directory="."
format="esm"
entry_names="packages/vuelil/@vue/server-renderer/dist/server-renderer.esm-browser.js"
[delivery.also.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/compiler-browser/server-renderer.js"

[[delivery.also]]
name="browser-production"
directory="."
format="esm"
entry_names="packages/vuelil/@vue/server-renderer/dist/server-renderer.esm-browser.prod.js"
[delivery.also.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/compiler-browser/production/server-renderer.js"

[[delivery.also]]
name="cjs"
directory="."
format="cjs"
entry_names="packages/vuelil/@vue/server-renderer/dist/server-renderer.cjs.js"
[delivery.also.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/compiler-cjs/development/server-renderer.cjs"

[[delivery.also]]
name="cjs-production"
directory="."
format="cjs"
entry_names="packages/vuelil/@vue/server-renderer/dist/server-renderer.cjs.prod.js"
[delivery.also.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/compiler-cjs/production/server-renderer.cjs"

[[delivery.also]]
name="index"
directory="."
format="cjs"
entry_names="packages/vuelil/@vue/server-renderer/index.js"
[delivery.also.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/compiler-cjs/development/server-renderer.cjs"

[[delivery.also]]
name="vue-esm"
format="esm"
directory="."
entry_names="packages/vuelil/server-renderer/index.mjs"
[delivery.also.external_specifiers]
