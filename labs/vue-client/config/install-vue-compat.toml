# Compiler-written forwarding entrypoints over one shared implementation graph.
# These preserve cross-package object identity and live binding transport.
[policy]
version=3
[objective]
codecs="brotli"
[effort]
level=13
[javascript]
assume_pristine_builtins=false
assume_pure_property_reads=false

[target.javascript]
format="esm"
[delivery]
# This provider is a compiler namespace whose default is the Vue constructor.
default_interop="es-module"
mode="single"
directory="."
entry_names="packages/vuelil/@vue/compat/dist/vue.esm-bundler.js"
[delivery.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/vue-compat.js"
[delivery.entries]
api="../src/package/entrypoints/vue-compat.lil"

[[delivery.also]]
name="browser"
directory="."
format="esm"
entry_names="packages/vuelil/@vue/compat/dist/vue.esm-browser.js"
[delivery.also.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/compiler-browser/compat/vue-compat.js"

[[delivery.also]]
name="browser-production"
directory="."
format="esm"
entry_names="packages/vuelil/@vue/compat/dist/vue.esm-browser.prod.js"
[delivery.also.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/compiler-browser/compat/production/vue-compat.js"

[[delivery.also]]
name="cjs"
directory="."
format="cjs"
entry_names="packages/vuelil/@vue/compat/dist/vue.cjs.js"
[delivery.also.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/compiler-cjs/compat/development/vue-compat.cjs"

[[delivery.also]]
name="cjs-production"
directory="."
format="cjs"
entry_names="packages/vuelil/@vue/compat/dist/vue.cjs.prod.js"
[delivery.also.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/compiler-cjs/compat/production/vue-compat.cjs"

[[delivery.also]]
name="index"
directory="."
format="cjs"
entry_names="packages/vuelil/@vue/compat/index.js"
[delivery.also.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/compiler-cjs/compat/development/vue-compat.cjs"
