# Compiler-written forwarding entrypoints over one shared implementation graph.
# These preserve cross-package object identity and live binding transport.
[policy]
version=3
[objective]
codecs="brotli"
[effort]
level=13
[javascript]
assume_pristine_builtins=false
assume_pure_property_reads=false

[target.javascript]
format="esm"
[delivery]
mode="single"
directory="."
entry_names="packages/vuelil/@vue/shared/dist/shared.esm-bundler.js"
[delivery.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/shared.js"
[delivery.entries]
api="../src/package/entrypoints/shared.lil"

[[delivery.also]]
name="cjs"
directory="."
format="cjs"
entry_names="packages/vuelil/@vue/shared/dist/shared.cjs.js"
[delivery.also.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/compiler-cjs/development/shared.cjs"

[[delivery.also]]
name="cjs-production"
directory="."
format="cjs"
entry_names="packages/vuelil/@vue/shared/dist/shared.cjs.prod.js"
[delivery.also.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/compiler-cjs/production/shared.cjs"

[[delivery.also]]
name="index"
directory="."
format="cjs"
entry_names="packages/vuelil/@vue/shared/index.js"
[delivery.also.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/compiler-cjs/development/shared.cjs"
