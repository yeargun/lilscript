# Compiler-written forwarding entrypoints over one shared implementation graph.
# These preserve cross-package object identity and live binding transport.
[policy]
version=3
[objective]
codecs="brotli"
[effort]
level=13
[javascript]
assume_pristine_builtins=false
assume_pure_property_reads=false

[target.javascript]
format="esm"
[delivery]
mode="single"
directory="."
entry_names="packages/vuelil/@vue/compat/dist/vue.runtime.esm-bundler.js"
[delivery.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/vue-compat.runtime.js"
[delivery.entries]
api="../src/package/entrypoints/vue-compat.runtime.lil"

[[delivery.also]]
name="browser"
directory="."
format="esm"
entry_names="packages/vuelil/@vue/compat/dist/vue.runtime.esm-browser.js"
[delivery.also.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/compiler-browser/compat/vue-compat.runtime.js"

[[delivery.also]]
name="browser-production"
directory="."
format="esm"
entry_names="packages/vuelil/@vue/compat/dist/vue.runtime.esm-browser.prod.js"
[delivery.also.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/compiler-browser/compat/production/vue-compat.runtime.js"
