# Compiler-written forwarding entrypoints over one shared implementation graph.
# These preserve cross-package object identity and live binding transport.
[policy]
version=3
[objective]
codecs="brotli"
[effort]
level=13
[javascript]
assume_pristine_builtins=false
assume_pure_property_reads=false

[target.javascript]
format="cjs"
[delivery]
mode="single"
directory="."
entry_names="packages/vuelil/@vue/compiler-ssr/dist/compiler-ssr.cjs.js"
[delivery.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/compiler-cjs/development/compiler-ssr.cjs"
[delivery.entries]
api="../src/package/entrypoints/compiler-ssr.lil"

[[delivery.also]]
name="index"
directory="."
format="cjs"
entry_names="packages/vuelil/@vue/compiler-ssr/index.js"
[delivery.also.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/compiler-cjs/development/compiler-ssr.cjs"
