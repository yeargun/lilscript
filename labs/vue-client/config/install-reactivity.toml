# Compiler-written forwarding entrypoints over one shared implementation graph.
# These preserve cross-package object identity and live binding transport.
[policy]
version=3
[objective]
codecs="brotli"
[effort]
level=13
[javascript]
assume_pristine_builtins=false
assume_pure_property_reads=false

[target.javascript]
format="esm"
[delivery]
mode="single"
directory="."
entry_names="packages/vuelil/@vue/reactivity/dist/reactivity.esm-bundler.js"
[delivery.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/reactivity.js"
[delivery.entries]
api="../src/package/entrypoints/reactivity.lil"

[[delivery.also]]
name="browser"
directory="."
format="esm"
entry_names="packages/vuelil/@vue/reactivity/dist/reactivity.esm-browser.js"
[delivery.also.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/compiler-browser/reactivity.js"

[[delivery.also]]
name="browser-production"
directory="."
format="esm"
entry_names="packages/vuelil/@vue/reactivity/dist/reactivity.esm-browser.prod.js"
[delivery.also.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/compiler-browser/production/reactivity.js"

[[delivery.also]]
name="cjs"
directory="."
format="cjs"
entry_names="packages/vuelil/@vue/reactivity/dist/reactivity.cjs.js"
[delivery.also.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/compiler-cjs/development/reactivity.cjs"

[[delivery.also]]
name="cjs-production"
directory="."
format="cjs"
entry_names="packages/vuelil/@vue/reactivity/dist/reactivity.cjs.prod.js"
[delivery.also.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/compiler-cjs/production/reactivity.cjs"

[[delivery.also]]
name="index"
directory="."
format="cjs"
entry_names="packages/vuelil/@vue/reactivity/index.js"
[delivery.also.external_specifiers]
"@vuelil/implementation"="./packages/vuelil/compiler-cjs/development/reactivity.cjs"
