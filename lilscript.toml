[optimization]
preset = "maximum"
profile_guided = true
call_site_specialization = true
capture_signature_cloning = true
identical_function_folding = true

[javascript]
priority = "size-first"
optimization_level = 15
cost_model = "brotli"
# Language tests use `print` as the observable oracle.
strip_console = false
pool_numeric_literals = true
candidate_search = "production"
# Retained whole-artifact frontier count. Omitted proposal work also honors it.
candidate_limit = 1536
# Approximate aggregate bytes of whole-artifact candidates retained and scored.
candidate_byte_budget = 1048576
candidate_beam_width = 12
# Optional structural plan/emission cap. Omitted also honors candidate_limit and
# artifact scaling; an explicit value bypasses artifact scaling, not level/search caps.
# candidate_proposal_limit = 384
# Shared terminal repair/validation/codec work cap. Omitted scales by artifact;
# an explicit value bypasses artifact scaling, not level/search caps.
# terminal_codec_probe_limit = 384
# For gzip/Brotli, a transfer non-regression may be admitted despite raw growth;
# this controls the fallback raw-side allowance against the configured baseline.
max_candidate_raw_growth_percent = 0
# Exact Held-Karp declaration ordering cutoff (0 = always use bounded heuristic, max 18).
function_layout_exact_limit = 13
# Keep a consistent short-name prefix available inside every function scope.
local_name_reserve = 48
stable_local_names = true
# function_spelling = "arrow" # explicit public-ABI override; arrow | function
# Omit this exact allowlist to use `priority` compression defaults.
# `optimization_level` separately controls the search-feature set.
# optimizations = ["parsed-peephole", "startup-cost-guard"]
compression = [
  "identifier-mangling",
  "entropy-aware-mangling",
  "quote-style-selection",
  "string-pooling",
  "size-aware-inlining",
  "compact-boolean-literals",
  "standard-grammar-elision",
  "structured-closure-inlining",
  "pure-helper-inlining",
  "dense-string-return-tables",
  "host-alias-spelling",
  "string-array-packing",
  "callee-default-arguments",
  "scalar-phi-copies",
  "phi-affinity-coalescing",
  "ir-inlining-variants",
  "ir-closure-factory-variants",
  "ir-phase-ordering-variants",
  "loop-spelling-selection",
  "mutation-spelling-selection",
]

[javascript.startup]
parse_weight = 1
compile_weight = 1
memory_weight = 1
# max_nesting = 128
parse_overhead_limit_percent = 30
compile_overhead_limit_percent = 30
memory_overhead_limit_percent = 35

[javascript.performance]
deoptimization_weight = 32
allocation_weight = 12
indirect_call_weight = 24
hot_code_weight = 1
max_regression_percent = 25

[profile]
# path = "lilscript.profile.json"
specialization_min_count = 100
max_specializations_per_function = 8
max_clone_instructions = 64

[native]
partial_escape_analysis = true
stack_allocation = true
region_allocation = true
stack_array_element_limit = 64

[bundle]
mode = "single"
min_chunk_bytes = 16384
max_chunks = 32
shared_min_imports = 2

[lint]
enabled = true
providers = ["correctness", "effects", "performance", "size", "web"]
preset = "recommended"
deny_warnings = false
exclude = ["**/generated/**"]
pure_extern_allowlist = []

[format]
enabled = true
line_width = 100
newline = "lf"
organize_imports = true
