[optimization]
preset = "maximum"

[javascript]
priority = "size-first"
cost_model = "brotli"
candidate_search = "production"
candidate_limit = 1536
compression = [
  "identifier-mangling",
  "entropy-aware-mangling",
  "quote-style-selection",
  "string-pooling",
  "size-aware-inlining",
  "safe-integer-coercion-elision",
  "compact-boolean-literals",
  "structured-closure-inlining",
  "string-array-packing",
  "scalar-phi-copies",
  "phi-affinity-coalescing",
]

[bundle]
mode = "single"
min_chunk_bytes = 16384
max_chunks = 32
shared_min_imports = 2

[lint]
enabled = true
preset = "recommended"
deny_warnings = false
exclude = ["**/generated/**"]
pure_extern_allowlist = []

[format]
enabled = true
line_width = 100
newline = "lf"
organize_imports = true
